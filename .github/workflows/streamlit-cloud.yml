name: Streamlit Community Cloud Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/streamlit-cloud.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/streamlit-cloud.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Verify Streamlit app files
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path.cwd()
          required = [
              repo / "app" / "app.py",
              repo / "app" / "lib" / "data.py",
          ]
          missing = [str(path.relative_to(repo)) for path in required if not path.exists()]
          if missing:
              raise SystemExit("Missing Streamlit app files: " + ", ".join(missing))

          data_dir = repo / "data"
          if not data_dir.exists():
              raise SystemExit(
                "Missing repo/data. Commit the data files into the repository before deploying to Streamlit Community Cloud."
              )
          PY

      - name: Compile the app package
        run: uv run python -m compileall app

      - name: Smoke test data loading
        run: |
          uv run python - <<'PY'
          from app.lib.data import load_airports, load_flights

          airports = load_airports()
          flights = load_flights()
          print(f"airports={len(airports)} flights={len(flights)}")

          if flights.empty:
              raise SystemExit(
                  "No flight data loaded. Commit the source spreadsheets into repo/data before deploying to Streamlit Community Cloud."
              )
          PY
